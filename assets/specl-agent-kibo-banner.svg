<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Spec Agent K</title>
  <desc id="desc">Banner image that reads "Spec Agent K" with a single-line haiku over the original-styled background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#414151"/>
      <stop offset="100%" stop-color="#19191c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="480" fill="url(#bg)" opacity="1"/>
  <g filter="url(#shadow)">
    <rect x="40" y="40" rx="16" ry="16" width="1120" height="400" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.35)"/>
  </g>
  <g fill="#ffffff">
    <text x="78" y="300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="100" font-weight="350" letter-spacing="0.5" text-rendering="geometricPrecision">
      Spec Agent K
    </text>
   <text x="82" y="360" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="300" font-style="italic" opacity="0.96">
    Specs whisper intent Agents stitch code patiently Tests bloom, bugs grow shy 🌻
  </text>
  </g>
</svg>
